<script>
window.goatcounter = {
  path: location.pathname || "/"
};
</script>

<script
  data-goatcounter="https://mobinakashaniyan.goatcounter.com/count"
  async
  src="https://gc.zgo.at/count.js">
</script>

<script>
document.addEventListener("DOMContentLoaded", async function () {
  const path = window.location.pathname || "/";
  const base =
    "https://mobinakashaniyan.goatcounter.com/counter/" + path + ".json";

  async function getViews(url) {
    try {
      const response = await fetch(url);
      if (!response.ok) return "—";

      const data = await response.json();
      return data.count || "0";
    } catch {
      return "—";
    }
  }

  const total = await getViews(base);
  const month = await getViews(base + "?start=month");

  const totalEl = document.getElementById("gc-total-views");
  const monthEl = document.getElementById("gc-month-views");

  if (totalEl) totalEl.textContent = total;
  if (monthEl) monthEl.textContent = month;
});
</script>
