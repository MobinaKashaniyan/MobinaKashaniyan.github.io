{{/* Single GoatCounter integration: auto-count real page paths + article view UI. */}}
<script>
window.goatcounter = {
  // Normalize so /index.html and trailing slashes match GoatCounter's stored paths.
  path: function () {
    let path = window.location.pathname || "/";
    if (path === "/index.html" || path.endsWith("/index.html")) return "/";
    if (path.length > 1) path = path.replace(/\/+$/, "");
    return path;
  }
};
</script>
<script
  data-goatcounter="https://mobinakashaniyan.goatcounter.com/count"
  data-goatcounter-settings='{"no_events":true}'
  async
  src="https://gc.zgo.at/count.js">
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const totalEl = document.getElementById("gc-total-views");
  const monthEl = document.getElementById("gc-month-views");
  if (!totalEl && !monthEl) return;

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function counterPath() {
    if (window.goatcounter && typeof window.goatcounter.get_data === "function") {
      const data = window.goatcounter.get_data();
      if (data && data.p) return data.p;
    }

    if (window.goatcounter && typeof window.goatcounter.path === "function") {
      return window.goatcounter.path();
    }

    let path = window.location.pathname || "/";
    if (path.length > 1) path = path.replace(/\/+$/, "");
    return path;
  }

  function parseCount(value) {
    if (value == null) return null;
    const digits = String(value).replace(/[^\d]/g, "");
    if (!digits) return null;
    return parseInt(digits, 10);
  }

  async function fetchCount(url) {
    try {
      const response = await fetch(url);
      // GoatCounter returns JSON even on 404 for unknown paths.
      const data = await response.json().catch(() => null);
      if (!data) return null;
      return parseCount(data.count);
    } catch {
      return null;
    }
  }

  function render(total, month) {
    // GoatCounter's public counter can 404/cache 0 for brand-new paths for up
    // to ~4 hours, even after the dashboard already shows the visit. Since this
    // pageview was just sent, show at least 1.
    const shownTotal = total == null || total < 1 ? 1 : total;
    const shownMonth = month == null || month < 1 ? 1 : month;

    if (totalEl) totalEl.textContent = String(shownTotal);
    if (monthEl) monthEl.textContent = String(shownMonth);
  }

  async function updateViews() {
    const path = encodeURIComponent(counterPath());
    const totalUrl =
      "https://mobinakashaniyan.goatcounter.com/counter/" + path + ".json";
    const monthUrl = totalUrl + "?start=month";

    // Avoid requesting the counter immediately after the first-ever hit for a
    // path: a 404 there gets cached by GoatCounter for up to four hours.
    await sleep(4000);

    let total = await fetchCount(totalUrl);
    let month = await fetchCount(monthUrl);
    render(total, month);

    // Retry later in case the path was still being created on first request.
    if (total == null || total < 1) {
      await sleep(15000);
      total = await fetchCount(totalUrl);
      month = await fetchCount(monthUrl);
      render(total, month);
    }
  }

  const started = Date.now();
  const waitForGoatCounter = setInterval(function () {
    const ready =
      window.goatcounter && typeof window.goatcounter.get_data === "function";
    const timedOut = Date.now() - started > 5000;
    if (!ready && !timedOut) return;

    clearInterval(waitForGoatCounter);
    updateViews();
  }, 100);
});
</script>
